name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Release version preflight
        run: scripts/check_release_version.sh "${{ github.ref_name }}"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Lightweight graph checks
        run: |
          set -e
          journey validate examples/lightweight_client_portal
          journey doctor examples/lightweight_client_portal
          journey diff examples/lightweight_client_portal --check
          journey status examples/lightweight_client_portal
      - name: Structured example checks
        run: |
          set -e
          for file in examples/*.journey; do
            journey validate "$file" --strict
            journey test "$file" --robustness strict --clean
          done
      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*
      - name: Generate checksums
        run: |
          cd dist
          sha256sum journey_lang-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Generate hash-verified install file
        run: scripts/write_release_install_requirements.sh dist "${{ github.ref_name }}"
      - name: Distribution artifact e2e
        run: |
          set -e
          for artifact in dist/journey_lang-*; do
            scripts/e2e_wheel_smoke.sh "$artifact"
          done
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: journey-dist
          path: dist/*
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/releases/${{ github.ref_name }}.md
          files: dist/*
      - name: Public release artifact e2e
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/e2e_public_release_smoke.sh "${{ github.ref_name }}"
