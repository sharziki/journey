name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Lightweight graph smoke
        run: |
          set -e
          tmpdir="$(mktemp -d)"
          mkdir -p "$tmpdir/app/dashboard" "$tmpdir/app/api/leads"
          printf 'export default function Dashboard() { return null }\n' > "$tmpdir/app/dashboard/page.tsx"
          printf 'export async function POST() { return Response.json({ ok: true }) }\n' > "$tmpdir/app/api/leads/route.ts"
          journey create "$tmpdir" --name "Smoke App"
          journey sync "$tmpdir" --name "Smoke App"
          journey validate "$tmpdir"
          journey manifest "$tmpdir" -o "$tmpdir/handoff"
          journey agent "$tmpdir" --no-test -o "$tmpdir/agent"
      - name: Validate examples
        run: |
          set -e
          for file in examples/*.journey; do
            journey validate "$file" --strict
          done
      - name: Generated acceptance tests
        run: |
          set -e
          for file in examples/*.journey; do
            journey test "$file" --robustness strict --clean
          done
      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*
