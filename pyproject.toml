[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-lang"
version = "0.2.3"
description = "Journey maps repo, page, API, and acceptance intent into lightweight files that coding agents can read, validate, and repair against."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Journey contributors" },
]
keywords = ["agents", "journey", "product-intent", "codegen", "fastapi", "pytest", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.0",
    "bcrypt>=4.0",
    "pytest>=7.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/sharziki/journey"
Repository = "https://github.com/sharziki/journey"
Issues = "https://github.com/sharziki/journey/issues"

[tool.setuptools.packages.find]
include = ["journey*"]

[project.scripts]
journey = "journey.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
