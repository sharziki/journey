[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-lang"
version = "0.1.0"
description = "Journey — a universal story format for software agents. Write the journey; agents build, test, and repair the software."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.0",
    "bcrypt>=4.0",
    "pytest>=7.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["journey*"]

[project.scripts]
journey = "journey.cli.main:main"
